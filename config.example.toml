# Copy this file to config.toml (gitignored) and adjust as needed.
# config.toml is loaded by every fitthing command.

# Path to the OAuth client credentials downloaded from Google Cloud Console
# (Credentials -> OAuth client -> Desktop app -> Download JSON).
client_secret_path = "secrets/client_secret.json"

# Where the saved sign-in (refresh token) is stored after `fitthing auth`.
token_path = "secrets/token.json"

# Where exported data and sync state are written.
output_dir = "data"

# Optional. First export backfills from this date (YYYY-MM-DD) through today.
# Leave unset to default to "today minus 365 days" at run time.
# start_date = "2025-09-16"

# Which data types to export: "all", or a list like ["steps", "weight", "sleep"].
# See `fitthing types` for the full list and which scopes you've granted.
data_types = "all"

# Size, in days, of each query window sent to the API.
window_days = 14

# Pause this many seconds before every API request. A full 1-year backfill
# across all data types makes hundreds of requests; with no pacing at all,
# a real run hit Google's (undocumented) rate limit partway through. Raise
# this if you still see repeated rate-limit errors; lower it once you're
# only doing small incremental syncs and want them to finish faster.
request_delay_seconds = 0.5

[cronometer]
# Automated download of daily calories/macros from cronometer.com. Unofficial
# endpoints — see agent-notes/2026-09-17-cronometer-nutrition-plan.md and
# agent-notes/2026-09-17-cronometer-endpoints.md. Defaults to disabled so
# nothing changes unless you opt in.
enabled = false
credentials_path = "secrets/cronometer.json"
session_path = "secrets/cronometer_session.json"
# First run backfills from here (YYYY-MM-DD); unset = today minus 365 days.
# start_date = "2025-09-17"
# These two are copied out of a real browser session and change when
# Cronometer redeploys their web app. If Cronometer export starts failing,
# refresh them by redoing agent-notes/2026-09-17-cronometer-endpoints.md's
# Phase 0 recon.
gwt_module_base = "https://cronometer.com/cronometer/"
gwt_permutation = ""   # filled in by Phase 0 recon; see agent-notes/2026-09-17-cronometer-endpoints.md
request_delay_seconds = 1.0
